name: DevPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devpulse_user
          POSTGRES_PASSWORD: devpulse_password
          POSTGRES_DB: devpulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies & Generate Prisma Client
        run: |
          cd server
          npm ci
          npx prisma generate
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "postgresql://devpulse_user:devpulse_password@localhost:5432/devpulse_db?schema=public"

      - name: Typecheck Server
        run: |
          cd server
          npx tsc --noEmit

      - name: Install Client Dependencies & Typecheck
        run: |
          cd client
          npm ci
          npx tsc --noEmit

  docker-build:
    name: Build Multi-Stage Docker Images
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: devpulse-server:latest

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: devpulse-client:latest
