name: DevPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Server Verification
      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Validate Prisma Schema & Generate Client
        run: |
          cd server
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://devpulse_user:devpulse_password@localhost:5432/devpulse_db?schema=public"

      - name: Build Server (TypeScript Compile)
        run: |
          cd server
          npm run build

      # Client Verification
      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Client (Vite Production Bundle)
        run: |
          cd client
          npm run build

  docker-build:
    name: Verify Multi-Stage Docker Builds
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image (Multi-Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: devpulse-server:latest

      - name: Build Client Image (Multi-Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: devpulse-client:latest
